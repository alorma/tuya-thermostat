name: Android Distribute

# Construeix el release signat i el puja a Firebase App Distribution. Es llança a mà.
#
# Secrets necessaris:
# - CALIU_RELEASE_KEYSTORE_BASE64: la keystore de release en base64 (`base64 -i caliu-release.jks`)
# - CALIU_RELEASE_STORE_PASSWORD, CALIU_RELEASE_KEY_ALIAS, CALIU_RELEASE_KEY_PASSWORD
# - FIREBASE_APP_ID: l'ID de l'app Android a Firebase (1:…:android:…)
# - FIREBASE_SERVICE_ACCOUNT: el JSON d'un compte de servei amb el rol «Firebase App Distribution Admin»
on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Grups de testers d'App Distribution (separats per comes)"
        required: true
        default: "testers"
      release_notes:
        description: "Notes de la versió"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Run checks
        run: ./gradlew ktlintCheck testDebugUnitTest

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CALIU_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/caliu-release.jks"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          CALIU_RELEASE_KEYSTORE: ${{ runner.temp }}/caliu-release.jks
          CALIU_RELEASE_STORE_PASSWORD: ${{ secrets.CALIU_RELEASE_STORE_PASSWORD }}
          CALIU_RELEASE_KEY_ALIAS: ${{ secrets.CALIU_RELEASE_KEY_ALIAS }}
          CALIU_RELEASE_KEY_PASSWORD: ${{ secrets.CALIU_RELEASE_KEY_PASSWORD }}
          CALIU_VERSION_CODE: ${{ github.run_number }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GROUPS: ${{ inputs.groups }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@15.34.0 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$GROUPS" \
            --release-notes "$RELEASE_NOTES"

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/caliu-release.jks" "$RUNNER_TEMP/firebase-sa.json"
