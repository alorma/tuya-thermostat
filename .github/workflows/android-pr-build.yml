name: Android PR Build

# Comprova ktlint i que l'APK de debug i el release es construeixen, sense pujar res
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-pr-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Sense keystore es construeix sense signar; serveix per comprovar que R8 i els recursos no trenquen el release
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
