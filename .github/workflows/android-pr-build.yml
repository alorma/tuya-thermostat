name: Android PR Build

# Comprova ktlint, els tests (JVM i captures) i que l'APK de debug es construeix, sense pujar res
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-pr-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Validate screenshots
        run: ./gradlew validateDebugScreenshotTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            android/*/build/reports/tests/
            android/*/build/reports/screenshotTest/
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
